<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 Manual Guide</title>
<meta name="description" content="Akvantis A1 — the printed installation guide, page by page.">
<meta property="og:title" content="A1 Manual Guide">
<meta property="og:image" content="OG-image.png">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="stylesheet" href="assets/ui-kit/tokens.css?v=kit8">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   A1 MANUAL GUIDE — DEMO. The Manual constructor with everything but the
   booklet taken out, for showing a client: no rail, no guides. The printed
   booklet in 2D or 3D (2026-10-07: the icons above it), and the manual's
   screen version on a desktop, a tablet and a phone (the bar on the right).
   Its pages turn — click the outer half of a page, or the arrow keys. Back from the first spread closes it on the cover,
   forward from the last closes it on the back cover.

   The booklet itself is a1-manual.html — the same document as in ../Manual,
   asked for with `turn=1` (it turns its own pages) and `bleed=1` (room
   around the sheet so a lifted page is not cut). Data: assets/manual-data.js.
   ───────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
/* nothing on the page is text to copy: no selection, no highlight on a double click */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
::selection{background:transparent}
.frame iframe{-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--black);color:var(--white);font-family:var(--font-primary);color-scheme:dark;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.frame{position:relative;flex:none;transform-origin:center center}
/* the scale eases with a turn, but not on load or on resize */
.frame.is-easing{transition:transform .9s cubic-bezier(.45,.05,.25,1)}
@media (prefers-reduced-motion:reduce){ .frame{transition:none} }
.frame iframe{position:absolute;left:-105mm;top:-74.25mm;width:calc(100% + 210mm);height:calc(100% + 148.5mm);
  border:0;background:transparent;pointer-events:none;color-scheme:dark}
.stage.is-edge{cursor:pointer}
/* the product mark, top right */
.mark{position:fixed;top:calc(var(--space-24) * var(--ui, 1) + env(safe-area-inset-top));right:calc(var(--space-24) * var(--ui, 1));z-index:2;color:var(--white);pointer-events:none}
.mark svg{height:calc(var(--space-24) * var(--ui, 1));width:auto;display:block}
/* brand, top left — as the Manual's rail header: the Akvantis mark and the title */
.brand{position:fixed;top:calc(var(--space-24) * var(--ui, 1) + env(safe-area-inset-top));left:calc(var(--space-24) * var(--ui, 1));z-index:2;
  display:flex;align-items:center;gap:calc(var(--space-12) * var(--ui, 1));color:var(--white);font-size:calc(var(--text-16) * var(--ui, 1));font-weight:600}
.brand-mark{width:calc(var(--space-24) * var(--ui, 1));height:calc(var(--space-24) * var(--ui, 1));display:block}
/* phone: the chrome shrinks */
@media (max-width:767px){
  .brand{left:var(--space-16);font-size:var(--text-14)}
  .mark{right:var(--space-16)}
  .mark svg{height:var(--space-16)}
}

/* ── 2D / 3D · THE FOUR VIEWS (2026-10-07) ──
   The printed booklet is the WebGL booklet of the constructor (assets/sheet3d.js):
   2D is that booklet seen strictly face-on, 3D is the same booklet held at an
   angle and turned by dragging. Above it two bare icons switch between them — a
   flat square and an isometric cube, no plates. On the right a small vertical
   bar switches what the manual is looked at on: print · desktop · tablet ·
   mobile, icons only. The three screen views are the manual's screen version
   (a1-manual?media=screen) in a frame of that size. */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .4s ease;touch-action:none}
#gl.is-on{opacity:1}
.stage.is-3d{cursor:grab}
.stage.is-3d.is-drag{cursor:grabbing}
.stage.is-zoom{cursor:grab}
.stage.is-zoom.is-drag{cursor:grabbing}
.stage.is-edge,.stage.is-3d.is-edge{cursor:pointer}
[hidden]{display:none!important}
.modes{position:fixed;z-index:3;left:50%;transform:translateX(-50%);top:calc(var(--space-16) * var(--ui, 1) + env(safe-area-inset-top));
  display:flex;gap:var(--space-4)}
.modes button,.views button{appearance:none;border:0;margin:0;padding:0;background:none;cursor:pointer;color:var(--white);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.modes button{width:var(--space-40);height:var(--space-40);opacity:.4;transition:opacity .15s}
.modes button svg{width:var(--space-24);height:var(--space-24);display:block}
.modes button[aria-pressed="true"]{opacity:1}
@media (hover:hover){ .modes button:hover{opacity:1} }
.modes button:focus-visible,.views button:focus-visible{outline:2px solid var(--white-32);outline-offset:2px;border-radius:var(--radius-8)}
.views{position:fixed;z-index:3;right:calc(var(--space-24) * var(--ui, 1));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4);border-radius:var(--radius-16);background:var(--black-900)}
.views button{width:var(--space-40);height:var(--space-40);border-radius:var(--radius-12);opacity:.48;transition:opacity .15s, background .15s}
.views button svg{width:20px;height:20px;display:block}
.views button[aria-pressed="true"]{opacity:1;background:var(--black-700)}
@media (hover:hover){ .views button:hover{opacity:1} }
/* a screen view: the manual's screen version in a frame of the device's size */
.device{position:relative;flex:none;transform-origin:center center;overflow:hidden;background:var(--white);border-radius:var(--space-24)}
.device[data-view="mobile"]{border-radius:var(--space-40)}
.device[data-view="tablet"]{border-radius:var(--space-32)}
.device iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--white);color-scheme:light;-webkit-user-select:auto;user-select:auto}
.stage.is-screen{touch-action:auto}
/* phone: the bar lies along the bottom edge, so it does not cover the booklet */
@media (max-width:767px){
  .views{top:auto;right:auto;left:50%;bottom:calc(var(--space-16) + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row}
  /* under the header row: beside the title there is no room for them */
  .modes{top:calc(var(--space-64) + env(safe-area-inset-top))}
}
</style>
</head>

<!-- three.js r128 — the same build the constructor uses; without it (or without WebGL) the booklet is the flat one -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/sheet3d.js?v=7"></script>
<script src="assets/manual-data.js?v=14"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var DATA = window.MANUAL_DATA || { spreads:[] };
  var N = Math.max(1, (DATA.spreads || []).length);
  /* view: sheet | desktop | tablet | mobile; mode: 2d | 3d (the sheet only);
     at: 0 = closed; back: closed on the back cover */
  var state = { view:'sheet', mode:'2d', at:0, back:false };
  var MM = 96 / 25.4, W = Math.round(420 * MM), H = Math.round(297 * MM);
  var VIEWS = { desktop:[1440, 900], tablet:[768, 1024], mobile:[390, 844] };
  var stage = $('stage');
  var FILE = location.protocol === 'file:';

  /* the documents ask their parent for the manual; answer with the bundled copy */
  addEventListener('message', function(e){
    if (!e.data || e.data.type !== 'a1-need-data') return;
    if (e.source === $('doc').contentWindow || e.source === $('screen').contentWindow)
      e.source.postMessage({ type:'a1-data', data:JSON.parse(JSON.stringify(DATA)), blobs:{} }, '*');
  });

  /* ══ THE BOOKLET IN WEBGL ══
     assets/sheet3d.js is the constructor's booklet. There it is fed with
     photographs of the document; here every page already IS a picture
     (`imageL` / `imageR` of the cover and of each spread), so a spread's
     texture is its two pages drawn side by side — no capture frames, no
     html2canvas. If WebGL, three.js or a page picture is missing, the page
     falls back to the flat booklet (the document turning its own pages). */
  function sides(){
    var c = DATA.cover || {}, out = [], ok = c.mode === 'image' && c.imageL && c.imageR;
    out.push({ key:'front', L:c.imageL, R:c.imageR });
    (DATA.spreads || []).forEach(function(sp, i){
      if (sp.mode !== 'image' || !sp.imageL || !sp.imageR) ok = false;
      out.push({ key:'inner-' + (i + 1), L:sp.imageL, R:sp.imageR });
    });
    return ok ? out : null;
  }
  var GL = false, LIST = sides();
  if (LIST && window.THREE && window.Sheet3D && !FILE){
    try { $('gl').hidden = false; window.Sheet3D.init($('gl')); GL = true; }
    catch (err){ GL = false; $('gl').hidden = true; console.warn('3D booklet: ' + err + ' — showing the flat one'); }
  }
  /* a phone gets pages at half size: nine spreads at full size are ~280 MB of texture */
  var SMALL = Math.min(screen.width, screen.height) < 768 || (navigator.deviceMemory && navigator.deviceMemory <= 4);
  var PW = SMALL ? 832 : 1664, PH = SMALL ? 1180 : 2360;
  var FONT = "'Cy Grotesk Key', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
  function loadSide(i){
    if (!GL || i >= LIST.length) return;
    var it = LIST[i], a = new Image(), b = new Image(), n = 0;
    function done(){
      if (++n < 2 || !GL) return;
      var cv = document.createElement('canvas'); cv.width = PW * 2; cv.height = PH;
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(a, 0, 0, PW, PH); cx.drawImage(b, PW, 0, PW, PH);
      /* Page numbers — the document's own `.page-no` (a1-manual.html), drawn on
         the picture: «/ 02», Cy Grotesk Key 500, 16 u, 17 u from the top,
         46 u from the left edge / 48 u from the right. From the spread's place
         in the booklet; the covers carry none. */
      if (i > 0){
        var u = PW / 832, two = function(n){ return '/ ' + ('0' + n).slice(-2); };
        cx.fillStyle = '#000'; cx.textBaseline = 'top';
        cx.font = '500 ' + (16 * u) + 'px ' + FONT;
        cx.textAlign = 'left';  cx.fillText(two(2 * i), 46 * u, 18 * u);
        cx.textAlign = 'right'; cx.fillText(two(2 * i + 1), PW * 2 - 48 * u, 18 * u);
      }
      window.Sheet3D.setTexture(it.key, cv);
      if (i === 0) $('gl').classList.add('is-on');   /* the cover is in: show the booklet */
      loadSide(i + 1);
    }
    function fail(){ if (!GL) return; GL = false; console.warn('3D booklet: ' + it.key + ' did not load — showing the flat one'); rows(); paint(); fit(); }
    a.onload = b.onload = done; a.onerror = b.onerror = fail;
    a.src = it.L; b.src = it.R;
  }

  /* the camera, the fold and the hinge — the constructor's own model */
  var CAM3D = { yaw:-24, pitch:14 };
  var cam = { yaw:0, pitch:0, fold:180, k:1, m:0 };   /* m: 0 = 2D … 1 = 3D, eased */
  var hinge = 'L', lastInner = 1;
  /* ── ZOOM (2026-10-07) ──
     z: 1 = the fitted booklet … 4; x, y: where the booklet is moved to, px of
     the screen. The wheel, a pinch on a touch screen and a pinch on a trackpad
     all change z about the point under the cursor / between the fingers; a
     zoomed booklet is moved by dragging (in 3D a drag still turns it — there
     it is moved with two fingers). Back at 1 it returns to the middle. */
  var zoom = { z:1, x:0, y:0 }, ZMAX = 4;
  function zoomClamp(){
    zoom.z = Math.max(1, Math.min(ZMAX, zoom.z));
    var mx = (zoom.z - 1) * innerWidth * .6, my = (zoom.z - 1) * innerHeight * .6;
    zoom.x = Math.max(-mx, Math.min(mx, zoom.x)); zoom.y = Math.max(-my, Math.min(my, zoom.y));
    stage.classList.toggle('is-zoom', zoom.z > 1.001 && !(GL && state.mode === '3d'));
  }
  function zoomShow(){ zoomClamp(); if (GL) apply3d(); else fit(); }
  /* to `z`, keeping the point (cx, cy) of the screen where it is */
  function zoomAt(z, cx, cy){
    z = Math.max(1, Math.min(ZMAX, z));
    var ox = cx - innerWidth / 2, oy = cy - innerHeight / 2, r = z / zoom.z;
    zoom.x = ox - (ox - zoom.x) * r; zoom.y = oy - (oy - zoom.y) * r; zoom.z = z;
    zoomShow();
  }
  function apply3d(){
    if (!GL) return;
    var v = cam.fold;
    window.Sheet3D.set({ yaw:cam.yaw, pitch:cam.pitch, fit:cam.k * zoom.z, panX:zoom.x, panY:zoom.y,
                         fold:hinge === 'L' ? v : 0, foldR:hinge === 'L' ? 180 : 180 - v,
                         spreads:N, open:state.at || (hinge === 'R' ? N : lastInner) });
  }
  var ease = function(u){ return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
  var still = function(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var foldAnim = null;
  function setFold(to, animate, done){
    if (!animate || still()){ foldAnim = null; cam.fold = to; fitGL(); apply3d(); if (done) done(); return; }
    var from = cam.fold, t0 = performance.now(), me = {};
    foldAnim = me;
    (function frame(now){
      if (foldAnim !== me) return;
      var u = Math.min(1, (now - t0) / 800);
      cam.fold = from + (to - from) * ease(u);
      fitGL(); apply3d();
      if (u < 1) requestAnimationFrame(frame); else { foldAnim = null; if (done) done(); }
    })(t0);
  }
  /* close on the cover ('L') or on the back cover ('R'); from the other hinge it lies flat first */
  function closeTo(side){
    state.at = 0; state.back = side === 'R';
    if (side === 'R') lastInner = N;
    if (hinge === side || cam.fold < .5){ hinge = side; setFold(180, true); return; }
    setFold(0, true, function(){ hinge = side; setFold(180, true); });
  }
  function goTo(at){
    at = Math.max(0, Math.min(N, at));
    if (at === state.at) return;
    if (!at){ closeTo('L'); return; }
    state.at = at; lastInner = at; state.back = false;
    apply3d();
    if (cam.fold > 90) setFold(0, true);
  }
  function step3d(dir){
    if (state.at === 0){
      if (!state.back && dir > 0) goTo(1);
      else if (state.back && dir < 0){ state.at = N; state.back = false; lastInner = N; setFold(0, true); }
      return;
    }
    var next = state.at + dir;
    if (next < 1) closeTo('L'); else if (next > N) closeTo('R'); else goTo(next);
  }
  var camAnim = null;
  function camTo(t, m){
    var from = { yaw:cam.yaw, pitch:cam.pitch, m:cam.m }, t0 = performance.now(), me = {};
    camAnim = me;
    if (still()){ cam.yaw = t.yaw; cam.pitch = t.pitch; cam.m = m; camAnim = null; fitGL(); apply3d(); return; }
    (function frame(now){
      if (camAnim !== me) return;
      var u = Math.min(1, (now - t0) / 600), e = ease(u);
      cam.yaw = from.yaw + (t.yaw - from.yaw) * e;
      cam.pitch = from.pitch + (t.pitch - from.pitch) * e;
      cam.m = from.m + (m - from.m) * e;
      fitGL(); apply3d();
      if (u < 1) requestAnimationFrame(frame); else camAnim = null;
    })(t0);
  }
  function setMode(m){
    if (state.mode === m) return;
    state.mode = m;
    rows(); zoomClamp();
    camTo(m === '3d' ? CAM3D : { yaw:0, pitch:0 }, m === '3d' ? 1 : 0);
  }

  /* ── FIT ──
     One rule for the flat booklet and the WebGL one: on a desktop the booklet
     is 80 % of the viewport's height (narrowed only if the window is too
     narrow); on a phone it takes the width. A closed booklet is one page
     wide and is fitted as one page — the size eases with the fold, so opening
     grows it instead of jumping. Held in the hand (3D) it stands a little
     smaller: a turned sheet reaches past its own rectangle. */
  function room(){
    var phone = innerWidth < 768;
    return { padX:phone ? 32 : 176, padY:phone ? 200 : 192 };
  }
  function scaleFor(w){          /* px per px of the sheet, for a booklet `w` wide */
    var r = room();
    return innerWidth >= 1024 ? Math.min(innerHeight * .8 / H, (innerWidth - r.padX) / w)
                              : Math.min((innerWidth - r.padX) / w, (innerHeight - r.padY) / H);
  }
  function fitGL(){
    if (!GL) return;
    var open = scaleFor(W), shut = scaleFor(W / 2), t = cam.fold / 180;
    var k = (open + (shut - open) * t) * (1 - .14 * cam.m);
    /* sheet3d's `fit` is the share of the canvas the open spread takes */
    cam.k = k / Math.min(innerWidth / W, innerHeight / H);
  }
  function fit(){
    if (state.view !== 'sheet'){
      var v = VIEWS[state.view], r = room(), d = $('device');
      var k = Math.min(1, (innerWidth - r.padX) / v[0], (innerHeight - (innerWidth < 768 ? 176 : 144)) / v[1]);
      d.style.width = v[0] + 'px'; d.style.height = v[1] + 'px';
      d.style.transform = 'scale(' + k.toFixed(3) + ')';
      return;
    }
    if (GL){ window.Sheet3D.resize(); fitGL(); apply3d(); return; }
    var f = $('frame');
    f.style.width = W + 'px'; f.style.height = H + 'px';
    f.style.transform = 'translate(' + zoom.x.toFixed(1) + 'px,' + zoom.y.toFixed(1) + 'px) scale(' + (scaleFor(state.at === 0 ? W / 2 : W) * zoom.z).toFixed(3) + ')';
  }

  /* ── WHAT IS ON THE STAGE ── */
  function hash(){ return state.at ? 'inner-' + state.at : (state.back ? 'back' : 'front'); }
  function paint(){
    /* Cloudflare serves `a1-manual.html` at `/a1-manual` (307). A frame must be
       asked for by its final address, or every turn — which changes only the
       fragment — would reload it through the redirect and lose the animation.
       Opened from disk there is no server, so the file name. */
    var name = FILE ? 'a1-manual.html' : 'a1-manual';
    if (state.view !== 'sheet'){
      var sc = $('screen');
      if (!sc.getAttribute('src')) sc.setAttribute('src', name + '?media=screen');
      return;
    }
    if (GL) return;
    /* only the fragment changes: the frame does not reload, the document turns */
    var el = $('doc'), next = name + '?media=sheet&flip=0&turn=1&bleed=1&pn=1#' + hash();
    if (el.getAttribute('src') !== next) el.setAttribute('src', next);
  }
  function rows(){
    var sheet = state.view === 'sheet';
    $('gl').hidden = !(sheet && GL);
    $('frame').hidden = !(sheet && !GL);
    $('device').hidden = sheet;
    $('device').dataset.view = state.view;
    $('modes').hidden = !(sheet && GL);
    stage.classList.toggle('is-screen', !sheet);
    stage.classList.toggle('is-3d', sheet && GL && state.mode === '3d');
    [].forEach.call($('modes').querySelectorAll('button'), function(b){ b.setAttribute('aria-pressed', b.dataset.mode === state.mode ? 'true' : 'false'); });
    [].forEach.call($('views').querySelectorAll('button'), function(b){ b.setAttribute('aria-pressed', b.dataset.view === state.view ? 'true' : 'false'); });
  }
  $('modes').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (b){ setMode(b.dataset.mode); b.blur(); }   /* blur: the arrow keys turn pages, they must not ring the icon */
  });
  $('views').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b || b.dataset.view === state.view) return;
    state.view = b.dataset.view; b.blur();
    rows(); paint(); fit();
  });

  /* ── THE FLAT BOOKLET (fallback) ── the document turns its own pages */
  function stepFlat(dir){
    if (state.at === 0){
      if (!state.back && dir > 0) state.at = 1;
      else if (state.back && dir < 0){ state.back = false; state.at = N; }
      else return;
    } else {
      var n = state.at + dir;
      if (n < 1){ state.at = 0; state.back = false; }
      else if (n > N){ state.at = 0; state.back = true; }
      else state.at = n;
    }
    var f = $('frame'); f.classList.add('is-easing');
    paint(); fit();
    clearTimeout(stepFlat.t); stepFlat.t = setTimeout(function(){ f.classList.remove('is-easing'); }, 950);
  }
  function step(dir){ if (state.view !== 'sheet') return; if (GL) step3d(dir); else stepFlat(dir); }

  /* ── TURNING BY HAND ──
     A click on the outer half of a page turns it — found on the paper itself
     in WebGL (a bent, turned page does not sit where its rectangle would), by
     the frame's quarters in the flat booklet. In 3D a drag turns the booklet
     in the hand instead; a press that moved more than 5 px is not a click. */
  function edgeAt(e){
    if (state.view !== 'sheet') return 0;
    if (GL){
      var h = window.Sheet3D.hit(e.clientX, e.clientY);
      return h && h.s >= .5 ? (h.even ? -1 : 1) : 0;
    }
    var r = $('frame').getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) return 0;
    var u = (e.clientX - r.left) / r.width;
    if (state.at === 0) return state.back ? (u >= .25 && u < .5 ? -1 : 0) : (u > .5 && u <= .75 ? 1 : 0);
    return u < .25 ? -1 : u > .75 ? 1 : 0;
  }
  var down = null, drag = null, pan = null, pinch = null, swiped = 0;
  function onStage(e){ return !(e.target.closest && e.target.closest('.modes, .views')); }
  addEventListener('pointerdown', function(e){
    if (state.view !== 'sheet' || !onStage(e) || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (pinch) return;
    down = { x:e.clientX, y:e.clientY };
    if (zoom.z > 1.001 && !(GL && state.mode === '3d')){
      pan = { x:e.clientX, y:e.clientY, zx:zoom.x, zy:zoom.y };
      stage.classList.add('is-drag');
      if (e.pointerType === 'mouse') e.preventDefault();
    }
    else if (GL && state.mode === '3d'){
      camAnim = null;
      drag = { x:e.clientX, y:e.clientY, yaw:cam.yaw, pitch:cam.pitch };
      stage.classList.add('is-drag');
      if (e.pointerType === 'mouse') e.preventDefault();
    }
  });
  addEventListener('pointermove', function(e){
    if (pinch) return;
    if (pan){ zoom.x = pan.zx + e.clientX - pan.x; zoom.y = pan.zy + e.clientY - pan.y; zoomShow(); return; }
    if (drag){
      cam.yaw = drag.yaw + (e.clientX - drag.x) * .4;
      cam.pitch = Math.max(-85, Math.min(85, drag.pitch - (e.clientY - drag.y) * .4));
      apply3d();
      return;
    }
    if (!down && e.pointerType === 'mouse') stage.classList.toggle('is-edge', onStage(e) && !!edgeAt(e));
  });
  ['pointerup', 'pointercancel'].forEach(function(k){
    addEventListener(k, function(e){
      var d = down; down = null; drag = null; pan = null; stage.classList.remove('is-drag');
      if (k !== 'pointerup' || !d || performance.now() - swiped < 400) return;
      if (Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) > 5) return;
      var dir = edgeAt(e); if (dir) step(dir);
    });
  });
  addEventListener('keydown', function(e){
    if (state.view !== 'sheet') return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  });
  /* Swipe on touch screens: right to left turns forward, left to right turns
     back. Horizontal only; a quick short flick counts too. Not in 3D — there
     the finger turns the booklet itself, and a page is turned by a tap. */
  var sw = null;
  addEventListener('touchstart', function(e){
    if (state.view !== 'sheet' || (GL && state.mode === '3d') || e.touches.length !== 1 || !onStage(e) || zoom.z > 1.001){ sw = null; return; }
    sw = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now() };
  }, { passive:true });
  addEventListener('touchend', function(e){
    if (!sw) return;
    var dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y;
    var dt = performance.now() - sw.t; sw = null;
    var fast = Math.abs(dx) / Math.max(dt, 1) > .35;
    if (Math.abs(dx) > Math.abs(dy) * 1.2 && (Math.abs(dx) > 40 || (fast && Math.abs(dx) > 16))){
      swiped = performance.now();
      step(dx < 0 ? 1 : -1);
    }
  });
  addEventListener('touchcancel', function(){ sw = null; });

  /* ── ZOOM BY HAND ── wheel · pinch on a touch screen · pinch on a trackpad */
  addEventListener('wheel', function(e){
    if (state.view !== 'sheet' || !onStage(e)) return;
    e.preventDefault();
    var d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);
    /* a trackpad pinch arrives as a wheel with ctrl held, in small steps */
    zoomAt(zoom.z * Math.exp(-d * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY);
  }, { passive:false });
  function span(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function mid(t){ return { x:(t[0].clientX + t[1].clientX) / 2, y:(t[0].clientY + t[1].clientY) / 2 }; }
  addEventListener('touchstart', function(e){
    if (state.view !== 'sheet' || e.touches.length !== 2 || !onStage(e)) return;
    var m = mid(e.touches);
    pinch = { d:span(e.touches) || 1, z:zoom.z, mx:m.x, my:m.y };
    down = null; drag = null; pan = null; sw = null; stage.classList.remove('is-drag');
  }, { passive:true });
  addEventListener('touchmove', function(e){
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var m = mid(e.touches);
    /* two fingers move the booklet as well as scale it */
    zoom.x += m.x - pinch.mx; zoom.y += m.y - pinch.my; pinch.mx = m.x; pinch.my = m.y;
    zoomAt(pinch.z * span(e.touches) / pinch.d, m.x, m.y);
  }, { passive:false });
  ['touchend', 'touchcancel'].forEach(function(k){
    addEventListener(k, function(e){ if (pinch && e.touches.length < 2){ pinch = null; swiped = performance.now(); } });
  });
  /* Safari on a Mac reports a trackpad pinch as gesture events, not as a wheel */
  var gz = 0;
  addEventListener('gesturestart', function(e){ if (state.view !== 'sheet') return; e.preventDefault(); gz = zoom.z; });
  addEventListener('gesturechange', function(e){
    if (state.view !== 'sheet') return; e.preventDefault();
    if (!pinch && gz) zoomAt(gz * e.scale, e.clientX, e.clientY);
  });
  addEventListener('gestureend', function(e){ gz = 0; });

  addEventListener('resize', function(){ zoomClamp(); fit(); });
  rows(); fit(); paint();
  if (GL){
    apply3d();
    /* the numbers are drawn in the kit's face: wait for it (not for long) before the first texture */
    var go = function(){ if (go.done) return; go.done = true; loadSide(0); };
    try { document.fonts.load("500 32px 'Cy Grotesk Key'").then(go, go); } catch (err){ go(); }
    setTimeout(go, 1500);
  }
}());
</script>
</body>
</html>
