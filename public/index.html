<title>A1 Manual Guide</title>
<meta name="description" content="Akvantis A1 — the printed installation guide, page by page.">
<meta property="og:title" content="A1 Manual Guide">

<style>
/* ─────────────────────────────────────────────────────────────────────────────
   A1 MANUAL GUIDE — DEMO. The Manual constructor with everything but the
   booklet taken out, for showing a client: no rail, no guides, no 3D. The
   printed booklet in 2D; its pages turn — click the outer half of a page,
   or the arrow keys. Back from the first spread closes it on the cover,
   forward from the last closes it on the back cover.

   The booklet itself is a1-manual.html — the same document as in ../Manual,
   asked for with `turn=1` (it turns its own pages) and `bleed=1` (room
   around the sheet so a lifted page is not cut). Data: assets/manual-data.js.
   ───────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
/* nothing on the page is text to copy: no selection, no highlight on a double click */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
::selection{background:transparent}
.frame iframe{-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--black);color:var(--white);font-family:var(--font-primary);color-scheme:dark;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.frame{position:relative;flex:none;transform-origin:center center}
/* the scale eases with a turn, but not on load or on resize */
.frame.is-easing{transition:transform .9s cubic-bezier(.45,.05,.25,1)}
@media (prefers-reduced-motion:reduce){ .frame{transition:none} }
.frame iframe{position:absolute;left:-105mm;top:-74.25mm;width:calc(100% + 210mm);height:calc(100% + 148.5mm);
  border:0;background:transparent;pointer-events:none;color-scheme:dark}
.stage.is-edge{cursor:pointer}
/* the product mark, top right */
.mark{position:fixed;top:calc(var(--space-24) + env(safe-area-inset-top));right:var(--space-24);z-index:2;color:var(--white);pointer-events:none}
.mark svg{height:var(--space-24);width:auto;display:block}
/* brand, top left — as the Manual's rail header: the Akvantis mark and the title */
.brand{position:fixed;top:calc(var(--space-24) + env(safe-area-inset-top));left:var(--space-24);z-index:2;
  display:flex;align-items:center;gap:var(--space-12);color:var(--white);font-size:var(--text-16);font-weight:600}
.brand-mark{width:var(--space-24);height:var(--space-24);display:block}
/* phone: the chrome shrinks */
@media (max-width:767px){
  .brand{left:var(--space-16);font-size:var(--text-14)}
  .mark{right:var(--space-16)}
  .mark svg{height:var(--space-16)}
}
}
</style>
</head>
<body>
<h1 style="position:absolute;left:-9999px">Akvantis A1 — Manual Guide</h1>
<div class="brand"><svg class="brand-mark" width="24" height="24" viewBox="0 0 48.05 48.37" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24.0209 0.146484C10.777 0.146484 0 10.9305 0 24.1831C0 37.4356 10.777 48.2196 24.0209 48.2196C37.2649 48.2196 48.0418 37.4356 48.0418 24.1831C48.0418 10.9305 37.2694 0.146484 24.0209 0.146484ZM24.0209 45.1933C12.4445 45.1933 3.02432 35.7671 3.02432 24.1831C3.02432 12.5991 12.4445 3.17277 24.0209 3.17277C35.5974 3.17277 45.0175 12.5991 45.0175 24.1831C45.0175 35.7671 35.5974 45.1933 24.0209 45.1933Z"/><path d="M18.6985 21.7971C20.7543 21.5777 22.7324 21.8199 25.0258 22.6337C29.1968 24.1285 33.3587 23.6119 36.6891 21.6508L35.1632 15.8679C32.9658 16.8965 30.7957 17.3262 28.5572 17.2531C26.1405 17.1754 24.6375 16.3799 22.6411 15.8725C21.2385 15.5159 19.8223 15.4199 18.3102 15.5434C15.7655 15.7537 13.463 16.5811 11.3524 18.1034L12.8828 23.8817C14.7788 22.6977 16.4874 22.0302 18.7031 21.7925L18.6985 21.7971Z"/><path d="M28.5617 26.2453C26.145 26.1676 24.6419 25.3721 22.6455 24.8647C21.243 24.5081 19.8268 24.4121 18.3146 24.5356C15.77 24.7459 13.4675 25.5733 11.3569 27.0956L12.8873 32.8738C14.7832 31.6898 16.4918 31.0224 18.7075 30.7847C20.7633 30.5653 22.7415 30.8076 25.0348 31.6213C29.2058 33.1161 33.3677 32.5996 36.6981 30.6384L35.1722 24.8556C32.9748 25.8841 30.8048 26.3139 28.5662 26.2407L28.5617 26.2453Z"/></svg><span>Manual Guide</span></div>

<div class="stage" id="stage">
  <div class="frame" id="frame"><iframe id="doc" title="A1 Manual Guide — the printed booklet" tabindex="-1"></iframe></div>
</div>



<script src="assets/manual-data.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var DATA = window.MANUAL_DATA || { spreads:[] };
  var N = Math.max(1, (DATA.spreads || []).length);
  /* at: 0 = closed; back: closed on the back cover */
  var state = { at:0, back:false };
  var MM = 96 / 25.4, W = Math.round(420 * MM), H = Math.round(297 * MM);

  /* the document asks its parent for the manual; answer with the bundled copy */
  addEventListener('message', function(e){
    if (e.data && e.data.type === 'a1-need-data' && e.source === $('doc').contentWindow)
      e.source.postMessage({ type:'a1-data', data:JSON.parse(JSON.stringify(DATA)), blobs:{} }, '*');
  });

  function hash(){ return state.at ? 'inner-' + state.at : (state.back ? 'back' : 'front'); }
  function paint(){
    /* Cloudflare serves `a1-manual.html` at `/a1-manual` (307). The frame must be
       asked for by its final address, or every turn — which changes only the
       fragment — would reload it through the redirect and lose the animation.
       Opened from disk there is no server, so the file name. */
    var base = (location.protocol === 'file:' ? 'a1-manual.html' : 'a1-manual') + '?media=sheet&flip=0&turn=1&bleed=1';
    /* only the fragment changes: the frame does not reload, the document turns */
    var el = $('doc'), next = base + '#' + hash();
    if (el.getAttribute('src') !== next) el.setAttribute('src', next);
  }
  function step(dir){
    if (state.at === 0){
      if (!state.back && dir > 0) state.at = 1;
      else if (state.back && dir < 0){ state.back = false; state.at = N; }
      else return;
    } else {
      var n = state.at + dir;
      if (n < 1){ state.at = 0; state.back = false; }
      else if (n > N){ state.at = 0; state.back = true; }
      else state.at = n;
    }
    var f = $('frame'); f.classList.add('is-easing');
    paint(); fit();
    clearTimeout(step.t); step.t = setTimeout(function(){ f.classList.remove('is-easing'); }, 950);
  }

  /* Fit, recomputed on every resize and on every open/close: the booklet fills
     the space between the chrome at any size (it scales up past 1440 too).
     A closed booklet is one page wide, so it is fitted as one page — on a
     phone that is what makes the cover readable. The scale eases with the
     turn (0.9 s), so opening grows the booklet instead of jumping. */
  function fit(){
    var phone = innerWidth < 768;
    var padX = phone ? 32 : 96, padY = phone ? 176 : 192;
    var w = state.at === 0 ? W / 2 : W;
    var k = Math.min((innerWidth - padX) / w, (innerHeight - padY) / H);
    var f = $('frame');
    f.style.width = W + 'px'; f.style.height = H + 'px';
    f.style.transform = 'scale(' + k.toFixed(3) + ')';
  }

  /* click zones: the outer half of each page; a closed booklet is one page in the middle */
  function edgeAt(e){
    var r = $('frame').getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) return 0;
    var u = (e.clientX - r.left) / r.width;
    if (state.at === 0) return state.back ? (u >= .25 && u < .5 ? -1 : 0) : (u > .5 && u <= .75 ? 1 : 0);
    return u < .25 ? -1 : u > .75 ? 1 : 0;
  }
  $('stage').addEventListener('click', function(e){ if (performance.now() - swiped < 400) return; var d = edgeAt(e); if (d) step(d); });
  $('stage').addEventListener('mousemove', function(e){ $('stage').classList.toggle('is-edge', !!edgeAt(e)); });
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  });
  /* Swipe on touch screens (2026-09-30): right to left turns forward, left
     to right turns back — the way a page is turned by hand. Horizontal only:
     a swipe that is mostly vertical is ignored, so a thumb resting on the
     screen does not turn anything. A quick short flick counts too (speed),
     and swipes in a row riffle, like quick clicks. The tap that ends a swipe
     is not also taken as a click on a page edge. */
  var sw = null, swiped = 0;
  $('stage').addEventListener('touchstart', function(e){
    if (e.touches.length !== 1){ sw = null; return; }
    sw = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now() };
  }, { passive:true });
  $('stage').addEventListener('touchend', function(e){
    if (!sw) return;
    var dx = e.changedTouches[0].clientX - sw.x, dy = e.changedTouches[0].clientY - sw.y;
    var dt = performance.now() - sw.t; sw = null;
    var fast = Math.abs(dx) / Math.max(dt, 1) > .35;
    if (Math.abs(dx) > Math.abs(dy) * 1.2 && (Math.abs(dx) > 40 || (fast && Math.abs(dx) > 16))){
      swiped = performance.now();
      step(dx < 0 ? 1 : -1);
    }
  });
  $('stage').addEventListener('touchcancel', function(){ sw = null; });
  addEventListener('resize', fit);
  fit(); paint();
}());
</script>
</body>
</html>
