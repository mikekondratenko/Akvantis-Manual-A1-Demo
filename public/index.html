<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A1 Manual Guide</title>
<meta name="description" content="Akvantis A1 — the printed installation guide, page by page.">
<meta property="og:title" content="A1 Manual Guide">
<meta property="og:image" content="OG-image.png">
<link rel="icon" type="image/png" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="stylesheet" href="assets/ui-kit/tokens.css?v=kit8">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   A1 MANUAL GUIDE — DEMO. The Manual constructor with everything but the
   booklet taken out, for showing a client: no rail, no guides, no 3D. The
   printed booklet in 2D; its pages turn — click the outer half of a page,
   or the arrow keys. Back from the first spread closes it on the cover,
   forward from the last closes it on the back cover.

   The booklet itself is a1-manual.html — the same document as in ../Manual,
   asked for with `turn=1` (it turns its own pages) and `bleed=1` (room
   around the sheet so a lifted page is not cut). Data: assets/manual-data.js.
   ───────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--black);color:var(--white);font-family:var(--font-primary);color-scheme:dark;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;flex:none;transform-origin:center center}
.frame iframe{position:absolute;left:-105mm;top:-74.25mm;width:calc(100% + 210mm);height:calc(100% + 148.5mm);
  border:0;background:transparent;pointer-events:none;color-scheme:dark}
.stage.is-edge{cursor:pointer}
/* the product mark, top right */
.mark{position:fixed;top:calc(var(--space-24) + env(safe-area-inset-top));right:var(--space-24);z-index:2;color:var(--white);pointer-events:none}
.mark svg{height:var(--space-24);width:auto;display:block}
/* page counter + hint, bottom centre */
.foot{position:fixed;left:0;right:0;bottom:calc(var(--space-24) + env(safe-area-inset-bottom));z-index:2;
  display:flex;justify-content:center;gap:var(--space-16);align-items:center;font-size:var(--text-12);color:var(--black-250)}
.foot button{font:inherit;color:var(--white);background:var(--white-08);border:0;border-radius:9999px;
  width:var(--space-32);height:var(--space-32);display:flex;align-items:center;justify-content:center;cursor:pointer}
.foot button:hover{background:var(--white-14)}
.foot button:disabled{opacity:.3;cursor:default}
.foot .where{min-width:var(--space-96);text-align:center;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<h1 style="position:absolute;left:-9999px">Akvantis A1 — Manual Guide</h1>
<div class="mark" aria-hidden="true"><svg viewBox="0 0 60 32" fill="currentColor" aria-hidden="true"><g clip-path="url(#dv-a1)"><path d="M58.3899 31.9991H53.6672C53.2877 31.9991 52.9802 31.6853 52.9802 31.2978V11.0141C52.9802 10.6222 52.666 10.3075 52.2821 10.3136C51.0791 10.3321 49.8667 10.3356 48.6439 10.3233C47.4169 10.311 46.2001 10.304 44.9928 10.3022C44.6142 10.3022 44.3076 9.98838 44.3076 9.60088V6.09052C44.3076 5.7223 44.5867 5.41633 44.9473 5.3909L46.7978 5.26027C48.4293 5.14367 49.6743 4.95342 50.533 4.69041C51.3917 4.4274 52.1216 3.9531 52.7226 3.26575C53.2636 2.64767 53.7926 1.70433 54.3103 0.434849C54.4177 0.171836 54.6675 0 54.9458 0H58.3899C58.7694 0 59.0768 0.313863 59.0768 0.70137V31.2986C59.0768 31.6861 58.7694 32 58.3899 32V31.9991Z"/><path d="M29.7047 0.376889C29.585 0.144889 29.3507 0 29.0967 0H16.4405C16.1856 0 15.9523 0.144889 15.8326 0.376889L0.0814639 30.9547C-0.162239 31.4284 0.170161 32 0.689429 32H6.05175C6.3075 32 6.5426 31.8533 6.66143 31.6196L11.272 22.5538C11.5269 22.0533 12.2184 22.0444 12.4845 22.5387L13.9355 25.2338C14.0569 25.4596 14.2877 25.5991 14.5374 25.5991H30.9499C31.2005 25.5991 31.4304 25.4587 31.5518 25.2338L33.0287 22.4907C33.2948 21.9964 33.9863 22.0044 34.2412 22.5058L38.8767 31.6196C38.9955 31.8533 39.2306 32 39.4864 32H44.8487C45.3679 32 45.7012 31.4284 45.4566 30.9547L29.7047 0.376889ZM13.101 18.9582L22.0879 1.288C22.2067 1.05422 22.4418 0.907556 22.6976 0.907556H22.8388C23.0946 0.907556 23.3297 1.05422 23.4485 1.288L32.4353 18.9582C32.6765 19.432 32.3432 20 31.8257 20H13.7107C13.1923 20 12.8599 19.432 13.101 18.9582Z"/></g><defs><clipPath id="dv-a1"><rect width="59.0769" height="32" fill="white"/></clipPath></defs></svg></div>

<div class="stage" id="stage">
  <div class="frame" id="frame"><iframe id="doc" title="A1 Manual Guide — the printed booklet" tabindex="-1"></iframe></div>
</div>

<div class="foot">
  <button type="button" id="prev" aria-label="Previous page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
  <span class="where" id="where" aria-live="polite"></span>
  <button type="button" id="next" aria-label="Next page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
</div>

<script src="assets/manual-data.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var DATA = window.MANUAL_DATA || { spreads:[] };
  var N = Math.max(1, (DATA.spreads || []).length);
  /* at: 0 = closed; back: closed on the back cover */
  var state = { at:0, back:false };
  var MM = 96 / 25.4, W = Math.round(420 * MM), H = Math.round(297 * MM);

  /* the document asks its parent for the manual; answer with the bundled copy */
  addEventListener('message', function(e){
    if (e.data && e.data.type === 'a1-need-data' && e.source === $('doc').contentWindow)
      e.source.postMessage({ type:'a1-data', data:JSON.parse(JSON.stringify(DATA)), blobs:{} }, '*');
  });

  function hash(){ return state.at ? 'inner-' + state.at : (state.back ? 'back' : 'front'); }
  function paint(){
    var base = 'a1-manual.html?media=sheet&flip=0&turn=1&bleed=1';
    /* only the fragment changes: the frame does not reload, the document turns */
    var el = $('doc'), next = base + '#' + hash();
    if (el.getAttribute('src') !== next) el.setAttribute('src', next);
    var pages = 2 * N + 2;
    $('where').textContent = state.at ? (2 * state.at) + '–' + (2 * state.at + 1) + ' / ' + pages
                                      : (state.back ? pages + ' / ' + pages : '1 / ' + pages);
    $('prev').disabled = state.at === 0 && !state.back;
    $('next').disabled = state.at === 0 && state.back;
  }
  function step(dir){
    if (state.at === 0){
      if (!state.back && dir > 0) state.at = 1;
      else if (state.back && dir < 0){ state.back = false; state.at = N; }
      else return;
    } else {
      var n = state.at + dir;
      if (n < 1){ state.at = 0; state.back = false; }
      else if (n > N){ state.at = 0; state.back = true; }
      else state.at = n;
    }
    paint();
  }

  function fit(){
    var k = Math.min(innerWidth * .86 / W, (innerHeight - 160) / H);
    var f = $('frame');
    f.style.width = W + 'px'; f.style.height = H + 'px';
    f.style.transform = 'scale(' + k.toFixed(3) + ')';
  }

  /* click zones: the outer half of each page; a closed booklet is one page in the middle */
  function edgeAt(e){
    var r = $('frame').getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) return 0;
    var u = (e.clientX - r.left) / r.width;
    if (state.at === 0) return state.back ? (u >= .25 && u < .5 ? -1 : 0) : (u > .5 && u <= .75 ? 1 : 0);
    return u < .25 ? -1 : u > .75 ? 1 : 0;
  }
  $('stage').addEventListener('click', function(e){ var d = edgeAt(e); if (d) step(d); });
  $('stage').addEventListener('mousemove', function(e){ $('stage').classList.toggle('is-edge', !!edgeAt(e)); });
  $('prev').addEventListener('click', function(){ step(-1); });
  $('next').addEventListener('click', function(){ step(1); });
  addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  });
  /* swipe on touch screens */
  var sx = null;
  $('stage').addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, { passive:true });
  $('stage').addEventListener('touchend', function(e){
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
  });
  addEventListener('resize', fit);
  fit(); paint();
}());
</script>
</body>
</html>
